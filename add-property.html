<!DOCTYPE html>
<html>
<head>
  <!-- admin auth gate (added on branch add-admin-auth) -->
  <style id="auth-gate-style">html{visibility:hidden!important}</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-auth.js"></script>
  <script src="auth-guard.js"></script>

  <title>Add Property | Spruce Admin</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    body { font-family: Arial; background:#f6f4ef; padding:30px; }
    .box { max-width:760px; background:white; padding:25px; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
    label { display:block; margin-top:14px; font-weight:bold; }
    input, select { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:8px; }
    button { margin-top:22px; padding:12px 18px; border:0; border-radius:10px; background:#24382f; color:white; font-weight:bold; cursor:pointer; }
    .msg { margin-top:18px; font-weight:bold; }
    .breakdown { margin-top:16px; }
    .breakdown h3 { margin:0 0 8px; }
    .breakdown table { width:100%; border-collapse:collapse; }
    .breakdown td { padding:7px 0; border-bottom:1px solid #eee; }
    .breakdown td.amt { text-align:right; font-variant-numeric:tabular-nums; }
    .breakdown tr.total td { font-weight:bold; border-top:2px solid #24382f; border-bottom:0; font-size:16px; }
  </style>
</head>
<body>

<div class="box">
  <h1>Add Property</h1>

  <form id="propertyForm">
    <label>Property ID</label>
    <input name="property_id" placeholder="TP1101" required>

    <label>Property Name</label>
    <input name="property_name" placeholder="Turquoise Place 1101" required>

    <label>Owner</label>
    <select name="owner_id" id="ownerSelect">
      <option value="">Loading owners...</option>
    </select>

    <label>Building</label>
    <input name="building" placeholder="Turquoise Place">

    <label>Unit Number</label>
    <input name="unit_number" placeholder="1101">

    <label>Region</label>
    <input name="region" placeholder="Orange Beach">

    <label>Plan Type</label>
    <select name="plan_type" required>
      <option value="SIGNATURE">The Signature</option>
      <option value="SIMPLY">The Edit</option>
    </select>

    <label>Status</label>
    <select name="status">
      <option value="ONBOARDING">Onboarding</option>
      <option value="ACTIVE">Active</option>
      <option value="INACTIVE">Inactive</option>
      <option value="SUSPENDED">Suspended</option>
    </select>

    <label>Bedrooms</label>
    <input name="bedrooms" type="number" step="0.5">

    <label>Bathrooms</label>
    <input name="bathrooms" type="number" step="0.5">

    <label>Sleeps</label>
    <input name="sleeps" type="number">

    <label>Square Feet</label>
    <input name="sq_ft" type="number">

    <label>Estimated Clean Hours</label>
    <input name="estimated_clean_hours" type="number" step="0.25">

    <label>Cleaning Fee</label>
    <input name="cleaning_fee" type="number" step="0.01">
    <button type="button" id="calcFeeBtn">Calculate Hospitality Fee</button>

    <label>Coffee Enabled</label>
    <select name="coffee_enabled">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>

    <label>Coffee Type</label>
    <select name="coffee_type">
      <option value="">None</option>
      <option value="PODS">Pods</option>
      <option value="GROUND">Ground</option>
      <option value="BOTH">Both</option>
    </select>

    <label>PAR Cleans</label>
    <input name="par_cleans" type="number" value="10">

    <button type="submit">Add Property</button>
  </form>

  <div class="msg" id="msg"></div>
  <div id="feeBreakdown" class="breakdown"></div>
</div>

<script>
async function loadOwners() {
  const select = document.getElementById('ownerSelect');

  try {
    const res = await fetch('/api/get-owners');
    const data = await res.json();

    select.innerHTML = '<option value="">Select owner</option>';

    if (!data.success || !data.owners.length) {
      select.innerHTML = '<option value="">No owners found</option>';
      return;
    }

    data.owners.forEach(owner => {
      const option = document.createElement('option');
      option.value = owner.owner_id;
      option.textContent = `${owner.owner_name} (${owner.owner_id})`;
      select.appendChild(option);
    });
  } catch (err) {
    select.innerHTML = '<option value="">Error loading owners</option>';
  }
}

document.addEventListener('DOMContentLoaded', loadOwners);

document.getElementById('propertyForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);
  const payload = Object.fromEntries(formData.entries());

  const res = await fetch('/api/add-property', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  document.getElementById('msg').innerText =
    data.success ? 'Property added successfully.' : 'Error: ' + data.error;
});

function feeMoney(v) {
  return '$' + Number(v || 0).toFixed(2);
}

// Renders the engine's itemized outputs as a readable list. Display only.
function renderFeeBreakdown(o) {
  const el = document.getElementById('feeBreakdown');
  const hours = Number(o.estimated_clean_hours || 0);
  const laborCost = Number(o.labor_cost || 0);
  const rate = hours ? laborCost / hours : 0;

  const rows = [
    ['Labor (' + hours + ' hrs \u00d7 ' + feeMoney(rate) + '/hr)', feeMoney(laborCost)],
    ['Consumables', feeMoney(o.consumables_cost)],
    ['Coffee', feeMoney(o.coffee_cost)],
    ['Laundry (' + Number(o.max_laundry_weight_lbs || 0) + ' lbs)', feeMoney(o.laundry_cost)],
    ['Linen recoup per clean', feeMoney(o.linen_recoup_per_clean)],
    ['Base cost', feeMoney(o.base_cost)],
    ['Markup', Number(o.markup_pct || 0) + '%']
  ];

  let html = '<h3>Hospitality Fee Breakdown</h3><table>';
  rows.forEach(function (r) {
    html += '<tr><td>' + r[0] + '</td><td class="amt">' + r[1] + '</td></tr>';
  });
  html += '<tr class="total"><td>Recommended fee</td><td class="amt">' +
    feeMoney(o.recommended_cleaning_fee) + '</td></tr></table>';
  el.innerHTML = html;
}

document.getElementById('calcFeeBtn').addEventListener('click', async () => {
  const msg = document.getElementById('msg');
  const formData = new FormData(document.getElementById('propertyForm'));
  const payload = Object.fromEntries(formData.entries());

  msg.innerText = 'Calculating hospitality fee...';
  document.getElementById('feeBreakdown').innerHTML = '';

  try {
    const res = await fetch('/api/calculate-property-pricing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    const fee = data && data.outputs
      ? data.outputs.recommended_cleaning_fee
      : data.recommended_cleaning_fee;

    if (data.success && fee != null) {
      const o = data.outputs || data;
      document.querySelector('input[name="cleaning_fee"]').value = fee;
      msg.innerText = '';
      renderFeeBreakdown(o);
    } else {
      msg.innerText = 'Error: ' + (data.error || 'Could not calculate fee');
    }
  } catch (err) {
    msg.innerText = 'Error calculating fee: ' + err.message;
  }
});
</script>

</body>
</html>
