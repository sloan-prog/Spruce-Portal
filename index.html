<!DOCTYPE html>
<html>
<head>
  <title>Spruce Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4f1;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #f7f5f2;
      border-right: 1px solid #ddd;
      padding: 20px;
      height: 100vh;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #184d43;
    }

    .nav-item {
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-item.active {
      background: #184d43;
      color: white;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
    }

    .hero {
      height: 250px;
      background-image: url('couch-hero.jpg');
      background-size: cover;
      border-radius: 10px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-green {
      background: #184d43;
      color: white;
    }

    /* CARDS */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      min-height: 200px;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .empty {
      color: #888;
      text-align: center;
      margin-top: 50px;
    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">Spruce</div>

    <div class="nav-item active">Overview</div>
    <div class="nav-item">Activity</div>
    <div class="nav-item">Cleans</div>
    <div class="nav-item">Invoices</div>
    <div class="nav-item">Files</div>
    <div class="nav-item">Notes</div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="hero"></div>

    <div class="header">
      <div>
        <div class="title">Miss Hoa's Project</div>
        <div>Orange Beach Signature Property</div>
      </div>

      <div>
        <button class="btn">Upload</button>
        <button class="btn btn-green">Send Message</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">Property Details</div>
        <div class="empty">Coming Thursday</div>
      </div>

      <div class="card">
        <div class="card-title">Messages</div>
        <div class="empty">No messages</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">Cleans</div>
        <div class="empty">No cleans</div>
      </div>

      <div class="card">
        <div class="card-title">Invoices</div>
        <div class="empty">No invoices</div>
      </div>
    </div>

  </div>

</body>
</html>
