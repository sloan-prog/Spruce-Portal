<!DOCTYPE html>
<html>
<head>
  <!-- admin auth gate (added on branch add-admin-auth) -->
  <style id="auth-gate-style">html{visibility:hidden!important}</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-auth.js"></script>
  <script src="auth-guard.js"></script>

  <title>Add Owner | Spruce Admin</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    body { font-family: Arial; background:#f6f4ef; padding:30px; }
    .box { max-width:700px; background:white; padding:25px; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
    label { display:block; margin-top:14px; font-weight:bold; }
    input, select, textarea { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:8px; }
    button { margin-top:22px; padding:12px 18px; border:0; border-radius:10px; background:#24382f; color:white; font-weight:bold; cursor:pointer; }
    .msg { margin-top:18px; font-weight:bold; }
  </style>
</head>
<body>

<div class="box">
  <h1>Add Owner</h1>

  <form id="ownerForm">
    <label>Owner ID</label>
    <input name="owner_id" placeholder="OWN002" required>

    <label>Owner Name</label>
    <input name="owner_name" placeholder="Jane Smith" required>

    <label>Owner Email</label>
    <input name="owner_email" type="email" placeholder="owner@email.com" required>

    <label>Owner Phone</label>
    <input name="owner_phone" placeholder="2515551234">

    <label>Billing Email</label>
    <input name="billing_email" type="email" placeholder="billing@email.com">

    <label>Preferred Contact Method</label>
    <select name="preferred_contact_method">
      <option value="email">Email</option>
      <option value="text">Text</option>
      <option value="phone">Phone</option>
    </select>

    <label>Owner Status</label>
    <select name="owner_status">
      <option value="ONBOARDING">Onboarding</option>
      <option value="ACTIVE">Active</option>
      <option value="INACTIVE">Inactive</option>
    </select>

    <label>Notes</label>
    <textarea name="notes" rows="4"></textarea>

    <button type="submit">Add Owner</button>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script>
document.getElementById('ownerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);
  const payload = Object.fromEntries(formData.entries());

  const res = await fetch('/api/add-owner', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  document.getElementById('msg').innerText =
    data.success ? 'Owner added successfully.' : 'Error: ' + data.error;
});
</script>

</body>
</html>
