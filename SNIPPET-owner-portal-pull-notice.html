<!-- ============================================================
     COFFEE PULL NOTICE — optional add to owner-portal.html
     Shows the owner a card when a coffee lot needs to be pulled, with the
     exact lot + roast date, so they can forward it to their cleaner.
     Backend: /api/coffee-pull-notice?property_id=XXX  (already deployed).

     WIRE-UP: the portal already knows which property it is showing.
     Replace PROPERTY_ID below with that value (the variable your portal
     uses for the current property's id — tell me its name and I'll drop it in).
     ============================================================ -->

<!-- 1) PLACEHOLDER — put where you want the card to appear (e.g. top of the dashboard): -->
<div id="coffeePullNotice" style="display:none;"></div>

<!-- 2) SCRIPT — paste before </body>: -->
<script>
(async function coffeePull(){
  // TODO: set this to the portal's current property id (e.g. window.PROPERTY_ID, state.property_id, etc.)
  const PROPERTY_ID = (window.PROPERTY_ID || '');
  if(!PROPERTY_ID) return;
  try{
    const r = await fetch('/api/coffee-pull-notice?property_id='+encodeURIComponent(PROPERTY_ID));
    const d = await r.json();
    const notices = d.notices||[];
    if(!notices.length) return;
    const box = document.getElementById('coffeePullNotice');
    box.style.display = 'block';
    box.innerHTML = notices.map(n =>
      '<div style="background:#FBF8F2;border:1px solid #C6A664;border-left:5px solid #c0392b;'+
      'border-radius:12px;padding:16px 18px;margin:0 0 14px;font-family:Georgia,serif;color:#2B2B2B;">'+
      '<div style="font-family:\'Cormorant Garamond\',serif;color:#4A1A1F;font-size:18px;margin-bottom:4px;">Coffee — action needed</div>'+
      '<div style="font-size:15px;line-height:1.5;">'+n.message+'</div>'+
      '<div style="font-size:13px;color:#8C8272;margin-top:6px;">Lot '+n.lot_code+' · roasted '+n.roast_date+'</div>'+
      '</div>'
    ).join('');
  }catch(e){ /* silent */ }
})();
</script>
