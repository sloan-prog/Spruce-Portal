<!-- ============================================================
     COFFEE — add to admin.html
     Two small edits. Both optional, but nice to have on the dashboard.
     ============================================================ -->

<!-- 1) NAV BUTTON — add inside the <nav> … </nav> block in admin.html,
        e.g. right after the "Atelier Inventory" button: -->
<a href="/admin-coffee.html"><button>Coffee</button></a>


<!-- 2) ATTENTION CARD — add inside the "Needs Attention" .grid in admin.html,
        as another .alert-box (spans 2 columns like the others): -->
<div class="alert-box attention" style="grid-column:span 2;">
  <div class="title">Coffee — Pull / Reorder</div>
  <ul class="alert-list" id="coffeeAttn"><li class="empty">Loading…</li></ul>
</div>


<!-- 3) SCRIPT — paste this <script> just before </body> in admin.html
        (it runs on its own; it does not touch loadDashboard): -->
<script>
(async function loadCoffeeCard(){
  const el = document.getElementById('coffeeAttn');
  if(!el) return;
  try{
    const r = await fetch('/api/coffee-board');
    const d = await r.json();
    const pulls = d.pulls||[], reorders = d.reorders||[];
    if(!pulls.length && !reorders.length){ el.innerHTML = '<li class="empty">Coffee is fresh. Nothing due.</li>'; return; }
    const line = (label, pid, extra) =>
      '<li><a class="prop-link" href="/admin-coffee.html">'+label+'</a>'+
      '<span class="pill">'+extra+'</span></li>';
    el.innerHTML =
      pulls.map(p => line((p.property_name||p.property_id)+' — pull '+p.lot_code, p.property_id, 'PULL')).join('') +
      reorders.map(r => line((r.property_name||r.property_id)+' — coffee reorder', r.property_id, 'ORDER')).join('');
  }catch(e){ el.innerHTML = '<li class="empty">Coffee board unavailable.</li>'; }
})();
</script>
