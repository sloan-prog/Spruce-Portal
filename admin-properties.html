<!DOCTYPE html>
<html>
<head>
  <!-- admin auth gate (added on branch add-admin-auth) -->
  <style id="auth-gate-style">html{visibility:hidden!important}</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-auth.js"></script>
  <script src="auth-guard.js"></script>

  <title>Properties | Spruce Admin</title>
  <style>
    body { font-family: Arial; padding:30px; background:#f6f4ef; }
    table { width:100%; background:white; border-collapse: collapse; }
    th, td { padding:12px; border-bottom:1px solid #eee; }
    tr:hover { background:#f2f2f2; cursor:pointer; }
  </style>
</head>
<body>
<p>
  <a href="/admin.html"><button>Dashboard</button></a>
  <a href="/add-property.html"><button>Add Property</button></a>
</p>
<h1>Properties</h1>

<table id="table">
  <thead>
    <tr>
      <th>Property</th>
      <th>Owner</th>
      <th>Building</th>
      <th>Plan</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function loadProperties() {
  const res = await fetch('/api/get-properties');
  const data = await res.json();

  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML = '';

  data.properties.forEach(p => {
    const row = document.createElement('tr');

    row.innerHTML = `
      <td>${p.property_name}</td>
      <td>${p.owners?.owner_name || ''}</td>
      <td>${p.building || ''}</td>
      <td>${({ SIGNATURE: 'The Signature', SIMPLY: 'The Edit' })[p.plan_type] || p.plan_type}</td>
    `;

    row.onclick = () => {
      window.location.href = `/admin-property.html?id=${p.property_id}`;
    };

    tbody.appendChild(row);
  });
}

loadProperties();
</script>

</body>
</html>
