<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | Spruce</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-auth.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f4ef; color:#24382f;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .box { width:100%; max-width:380px; background:white; padding:28px; border-radius:16px;
           box-shadow:0 4px 14px rgba(0,0,0,.08); }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { margin:0 0 20px; color:#6b7a72; font-size:14px; }
    label { display:block; font-weight:bold; margin-bottom:6px; font-size:14px; }
    input { width:100%; padding:11px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
    #code { letter-spacing:.4em; text-align:center; font-size:20px; font-weight:bold; }
    button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px;
             background:#24382f; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    .linkbtn { background:none; color:#6b7a72; font-weight:normal; text-decoration:underline;
               padding:4px; margin-top:10px; font-size:13px; }
    .msg { margin-top:16px; font-size:14px; font-weight:bold; min-height:1em; }
    .msg.err { color:#b3261e; }
    .msg.ok  { color:#1e7d4f; }
    .note { margin-top:18px; font-size:12px; color:#9aa7a0; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Spruce Admin</h1>
    <p class="sub">Sign in with your approved admin email. We'll send you a 6-digit code.</p>

    <!-- Step 1: email -->
    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
      <button id="submit" type="submit">Send code</button>
    </form>

    <!-- Step 2: code -->
    <form id="code-form" class="hidden">
      <label for="code">Enter the 6-digit code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" pattern="[0-9]*" placeholder="••••••" />
      <button id="verify" type="submit">Verify &amp; sign in</button>
      <button id="restart" type="button" class="linkbtn">Use a different email</button>
    </form>

    <div id="msg" class="msg" role="status"></div>
    <div id="signedout" class="hidden">
      <button id="signout" type="button">Sign out</button>
    </div>

    <p class="note">Access is restricted to an approved allowlist. Other emails will be blocked.</p>
  </div>

  <script>
    (function () {
      var A = window.SPRUCE_ADMIN_AUTH;
      var msg = document.getElementById("msg");
      var form = document.getElementById("form");
      var codeForm = document.getElementById("code-form");
      var submit = document.getElementById("submit");
      var verify = document.getElementById("verify");
      var signedoutBox = document.getElementById("signedout");
      var currentEmail = "";

      var ADMIN_PAGES = [
        "admin.html", "admin-properties.html", "admin-property.html",
        "add-property.html", "add-owner.html"
      ];

      function setMsg(text, kind) {
        msg.textContent = text || "";
        msg.className = "msg" + (kind ? " " + kind : "");
      }

      // Only allow redirecting to a known relative admin page (prevents open redirects).
      function safeNext() {
        var raw = new URLSearchParams(location.search).get("next") || "";
        try { raw = decodeURIComponent(raw); } catch (e) {}
        var file = raw.split("?")[0].replace(/^\//, "");
        if (ADMIN_PAGES.indexOf(file) !== -1) return raw.replace(/^\//, "");
        return "admin.html";
      }

      if (!A || !window.supabase || !window.supabase.createClient) {
        setMsg("Auth failed to load. Please refresh.", "err");
        return;
      }

      var client = A.client();

      // Already signed in? (e.g. returning with a live session)
      client.auth.getSession().then(function (res) {
        var session = res && res.data ? res.data.session : null;
        if (!session) return;
        var email = session.user ? session.user.email : null;
        if (A.isAllowed(email)) {
          setMsg("Signed in. Redirecting...", "ok");
          location.replace(safeNext());
        } else {
          form.classList.add("hidden");
          signedoutBox.classList.remove("hidden");
          setMsg("This email (" + email + ") is not an approved admin.", "err");
        }
      });

      document.getElementById("signout").addEventListener("click", function () {
        client.auth.signOut().then(function () { location.reload(); });
      });

      document.getElementById("restart").addEventListener("click", function () {
        codeForm.classList.add("hidden");
        form.classList.remove("hidden");
        submit.disabled = false;
        setMsg("", "");
      });

      // Step 1 — send the code
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        if (!email) return;

        if (!A.isAllowed(email)) {
          setMsg("That email is not on the admin allowlist.", "err");
          return;
        }

        submit.disabled = true;
        setMsg("Sending...", "");

        client.auth
          .signInWithOtp({ email: email, options: { shouldCreateUser: true } })
          .then(function (r) {
            if (r.error) {
              setMsg(r.error.message || "Could not send code.", "err");
              submit.disabled = false;
            } else {
              currentEmail = email;
              form.classList.add("hidden");
              codeForm.classList.remove("hidden");
              setMsg("We emailed you a 6-digit code. Enter it above.", "ok");
              document.getElementById("code").focus();
            }
          })
          .catch(function () {
            setMsg("Could not send code. Try again.", "err");
            submit.disabled = false;
          });
      });

      // Step 2 — verify the code
      codeForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var token = document.getElementById("code").value.trim();
        if (token.length < 6) {
          setMsg("That code is six digits.", "err");
          return;
        }
        verify.disabled = true;
        setMsg("Verifying...", "");

        client.auth
          .verifyOtp({ email: currentEmail, token: token, type: "email" })
          .then(function (r) {
            if (r.error) {
              setMsg(r.error.message || "That code didn't work. Try again.", "err");
              verify.disabled = false;
              return;
            }
            var session = r.data ? r.data.session : null;
            var email = session && session.user ? session.user.email : currentEmail;
            if (A.isAllowed(email)) {
              setMsg("Signed in. Redirecting...", "ok");
              location.replace(safeNext());
            } else {
              client.auth.signOut();
              setMsg("This email (" + email + ") is not an approved admin.", "err");
              verify.disabled = false;
            }
          })
          .catch(function () {
            setMsg("Could not verify. Try again.", "err");
            verify.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
